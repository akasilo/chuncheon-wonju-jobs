<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>춘천·원주 채용</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%2313262E%22/%3E%3Cpath d=%22M3 9h10%22 stroke=%22%23EEF3F2%22 stroke-width=%221.5%22/%3E%3Cpath d=%22M5 9V6M8 9V4M11 9V7%22 stroke=%22%236AA5F2%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
<script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
/* 페이퍼로지 (projectnoonnu 배포본) */
@font-face { font-family: "Paperlogy"; font-weight: 300; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2") format("woff2"); }
@font-face { font-family: "Paperlogy"; font-weight: 400; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2") format("woff2"); }
@font-face { font-family: "Paperlogy"; font-weight: 500; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2") format("woff2"); }
@font-face { font-family: "Paperlogy"; font-weight: 600; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2") format("woff2"); }
@font-face { font-family: "Paperlogy"; font-weight: 700; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2") format("woff2"); }
</style>
<style>
:root {
  color-scheme: light;
  --plane: #EEF3F2;
  --sheet: #FDFEFE;
  --ink: #13262E;
  --ink-2: #4B5E64;
  --ink-3: #5F7176;
  --rule: #D5DFDF;
  --rule-soft: #E4EBEB;
  --rule-strong: #B9C7C8;
  --week-band: #E9F0F1;
  --hover-wash: #F2F6F7;
  --open-wash: #F5F8F8;
  --city-cc: #1F66C9;
  --city-wj: #B0577A;
  --link: #1F66C9;
  --due-crit-bg: #C4322B; --due-crit-fg: #FFFFFF;
  --due-warn-bg: #FDF1DC; --due-warn-fg: #9A5A00; --due-warn-line: #E9C98F;
  --star: #B7791F;
  --pill-strong-bg: #13262E; --pill-strong-fg: #FDFEFE;
  --focus: #1F66C9;

  --font-sans: "Paperlogy", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-serif: var(--font-sans); /* 제목도 페이퍼로지로 통일 */
  --r-sheet: 16px; --r-btn: 8px; --r-badge: 6px; --r-chip: 999px;
  --gut: 32px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0E171B;
  --sheet: #18242A;
  --ink: #E6EEEE;
  --ink-2: #A9BBBE;
  --ink-3: #8A9DA1;
  --rule: #2A3A41;
  --rule-soft: #23323A;
  --rule-strong: #3A4C53;
  --week-band: #1D2C33;
  --hover-wash: #1C2B32;
  --open-wash: #1B2930;
  --city-cc: #3F86E8;
  --city-wj: #CF6B9E;
  --link: #6AA5F2;
  --due-crit-bg: #3B1F1D; --due-crit-fg: #FF8A7A;
  --due-warn-bg: #33290F; --due-warn-fg: #F0B24A; --due-warn-line: #6B5420;
  --star: #E8B04A;
  --pill-strong-bg: #E6EEEE; --pill-strong-fg: #18242A;
  --focus: #6AA5F2;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 400 15px/1.55 var(--font-sans);
  word-break: keep-all; line-break: strict; overflow-wrap: break-word;
}
a { color: var(--link); }
button, input, select { font: inherit; color: inherit; }
:where(a, button, input, select, summary, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; flex: none; vertical-align: -2px; }

/* ---------- page frame ---------- */
.page { max-width: 1880px; margin: 0 auto; padding: 28px clamp(16px, 2.5vw, 48px) 64px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 4px 18px; }
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 { font: 600 19px/1.3 var(--font-serif); margin: 0; letter-spacing: -0.01em; }
.stamp { color: var(--ink-2); font-size: 13px; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.ghost { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--r-btn);
  background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; text-decoration: none; }
.ghost:hover { border-color: var(--rule); color: var(--ink); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sheet); }
.sheet + .sheet { margin-top: 20px; }

/* ---------- lead ---------- */
.lead { padding: 28px var(--gut) 0; }
.lead h2 { font: 600 26px/1.4 var(--font-serif); margin: 0; letter-spacing: -0.015em; text-wrap: balance; max-width: 34em; }
.lead .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.lead .sub button { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px 0 12px; border: 1px solid var(--rule); border-radius: var(--r-chip);
  background: var(--sheet); color: var(--ink); font-size: 14px; cursor: pointer; }
.chip:hover { border-color: var(--rule-strong); }
.chip .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip .dot.crit { background: #C4322B; } .chip .dot.warn { background: #D08A1E; }
.chip svg { width: 13px; height: 13px; color: var(--star); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip[aria-pressed="true"] svg { color: currentColor; }
.chip.zero { color: var(--ink-3); }

/* ---------- ridge (deadline strip) ---------- */
.ridge { margin: 22px 0 0; display: grid; grid-template-columns: 52px 1fr; gap: 0 10px; align-items: stretch; }
.ridge .legend { display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: var(--ink-2); padding: 4px 0 20px; }
.ridge .legend span { display: inline-flex; align-items: center; gap: 5px; }
.ridge .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.days { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)) 14px 44px 44px; position: relative; }
.day { position: relative; display: grid; grid-template-rows: 34px 1px 34px 18px; justify-items: center; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; }
.day.wk { background: var(--week-band); border-radius: 0; }
.day.wk.first { border-radius: 6px 0 0 6px; } .day.wk.last { border-radius: 0 6px 6px 0; }
.day .up, .day .dn { width: 100%; display: flex; justify-content: center; }
.day .up { align-items: flex-end; } .day .dn { align-items: flex-start; }
.day .bar { width: min(9px, 56%); }
.day .up .bar { background: var(--city-cc); border-radius: 3px 3px 0 0; margin-bottom: 1px; }
.day .dn .bar { background: var(--city-wj); border-radius: 0 0 3px 3px; margin-top: 1px; }
.day .axis { width: 100%; background: var(--rule-strong); }
.day .lab { font-size: 12px; color: var(--ink-3); line-height: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.day:hover, .day[aria-pressed="true"] { background: var(--hover-wash); }
.day[aria-pressed="true"] .lab { color: var(--ink); font-weight: 600; }
.day:disabled { cursor: default; }
.bucket { display: grid; grid-template-rows: 34px 1px 34px 18px; justify-items: center; font-size: 12px; color: var(--ink-2); }
.bucket b { align-self: end; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.bucket .axis { width: 100%; background: var(--rule); }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; line-height: 1.45; padding: 6px 9px; border-radius: 6px; max-width: 260px; }
.tip[hidden] { display: none; }

/* ---------- filter bar ---------- */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 16px var(--gut); margin-top: 20px; border-top: 1px solid var(--rule-soft); }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--rule); border-radius: var(--r-btn); margin: 0; min-inline-size: 0; }
.seg legend { padding: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 6px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg label i { width: 7px; height: 7px; border-radius: 2px; }
.seg input:checked + label { background: var(--ink); color: var(--sheet); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; min-height: 36px; padding: 0 30px 0 12px; border: 1px solid var(--rule); border-radius: var(--r-btn);
  background: var(--sheet); font-size: 14px; color: var(--ink); cursor: pointer; }
.sel select.set { border-color: var(--ink-2); font-weight: 600; }
.sel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.search { flex: 1 1 200px; min-width: 160px; position: relative; }
.search input { width: 100%; min-height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--rule); border-radius: var(--r-btn); background: var(--sheet); font-size: 14px; }
.search input::placeholder { color: var(--ink-3); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.tog { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.tog input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 999px; background: var(--rule-strong); position: relative; margin: 0; cursor: pointer; flex: none; }
.tog input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--sheet); }
.tog input:checked { background: var(--ink); }
.tog input:checked::after { left: 14px; }
.tog:has(input:checked) { color: var(--ink); }
.more-btn { display: none; }
.more { display: contents; }
.reset { background: none; border: 0; color: var(--link); font-size: 13px; cursor: pointer; padding: 0 4px; min-height: 36px; }
.reset[hidden] { display: none; }

/* ---------- table ---------- */
.table-wrap { padding: 0 calc(var(--gut) - 12px) 8px; }
table.jobs { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.jobs col.c-star { width: 40px; } .jobs col.c-due { width: 112px; } .jobs col.c-city { width: 58px; } .jobs col.c-cat { width: 82px; }
.jobs col.c-edu { width: 92px; } .jobs col.c-con { width: 78px; } .jobs col.c-start { width: 92px; } .jobs col.c-pay { width: 96px; } .jobs col.c-src { width: 150px; }
.jobs th, .jobs td { padding: 0 12px; text-align: left; vertical-align: middle; }
.jobs thead th { position: sticky; top: 0; z-index: 3; background: var(--sheet); height: 40px; border-bottom: 1px solid var(--rule-strong);
  font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.jobs thead th.r, .jobs td.r { text-align: right; }
.jobs th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
.jobs th button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.jobs th button:hover { color: var(--ink); }
.jobs th .arw { width: 8px; height: 10px; opacity: .35; }
.jobs th[aria-sort] { color: var(--ink); font-weight: 600; }
.jobs th[aria-sort] .arw { opacity: 1; }
.jobs th[aria-sort="descending"] .arw { transform: scaleY(-1); }

tr.job td { height: 58px; border-bottom: 1px solid var(--rule-soft); padding-top: 8px; padding-bottom: 8px; }
tr.job { cursor: pointer; scroll-margin-top: 48px; }
tr.job:hover td { background: var(--hover-wash); }
tr.job.open td { background: var(--open-wash); border-bottom-color: transparent; }
tr.grp td { padding: 18px 12px 6px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
tr.grp b { color: var(--ink); font-weight: 600; margin-right: 6px; }

.star { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--rule-strong); margin-left: -6px; }
.star:hover { color: var(--ink-3); background: var(--hover-wash); }
.star[aria-pressed="true"] { color: var(--star); }
.star svg { width: 17px; height: 17px; }

.due { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: var(--r-badge); font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.crit { background: var(--due-crit-bg); color: var(--due-crit-fg); }
.due.warn { background: var(--due-warn-bg); color: var(--due-warn-fg); box-shadow: inset 0 0 0 1px var(--due-warn-line); }
.due.calm { padding: 0; color: var(--ink); font-weight: 500; }
.due.open { padding: 0; color: var(--ink-3); font-weight: 500; }
.due.past { padding: 0; color: var(--ink-3); text-decoration: line-through; font-weight: 400; }
.ddate { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.ttl-line { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.ttl { all: unset; cursor: pointer; font: 600 15px/1.4 var(--font-serif); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; letter-spacing: -0.01em; }
.ttl:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
tr.job:hover .ttl { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
.new { flex: none; font: 600 12px/1 var(--font-sans); color: var(--link); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; transform: translateY(-1px); }
.org { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.org .org-n { color: var(--ink-2); }
.org .summ { color: var(--ink-3); margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--rule); }
.m-meta { display: none; }

.city { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.city::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.cc { --c: var(--city-cc); } .wj { --c: var(--city-wj); }
.cell-sm { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.edu { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-badge); font-size: 12px; white-space: nowrap; border: 1px solid var(--rule); color: var(--ink-2); }
.edu.e5 { background: var(--pill-strong-bg); color: var(--pill-strong-fg); border-color: var(--pill-strong-bg); font-weight: 600; }
.edu.e4 { border: 1.5px solid var(--ink); color: var(--ink); font-weight: 600; }
.edu.e0 { border-color: transparent; padding: 0; color: var(--ink-3); }
.dash { color: var(--ink-3); }

.pay { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pay-sub { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pay.none { font-size: 13px; font-weight: 400; color: var(--ink-3); }

.src { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; overflow: hidden; }
.src a { display: inline-flex; align-items: center; gap: 3px; text-decoration: none; color: var(--link); }
.src a:hover { text-decoration: underline; text-underline-offset: 3px; }
.src .att { color: var(--ink-2); }
.src .att:hover { color: var(--ink); }
.src .ext { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); }

/* ---------- expanded detail ---------- */
tr.detail td { padding: 4px 12px 26px calc(40px + 112px + 12px); background: var(--open-wash); border-bottom: 1px solid var(--rule); }
/* 짧은 항목(학력·전공·경력·계약…)은 라벨 위·값 아래의 사양표, 긴 항목은 라벨 옆 한 줄 */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px 32px; margin: 0; max-width: 1240px; }
.facts > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.facts > div.wide { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.facts > div.wide:first-of-type { padding-bottom: 4px; }
.facts > div.wide { grid-column: 1 / -1; }
.facts dt { font-size: 13px; color: var(--ink-3); }
.facts dd { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); max-width: 72ch; }
.facts dd .muted { color: var(--ink-2); font-size: 13px; }
.facts dd ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.facts dd a { text-underline-offset: 3px; }
.facts .lead-sum { font: 600 15px/1.5 var(--font-serif); }
.facts .ext { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.pending { margin: 0 0 14px; font-size: 13px; color: var(--ink-3); }

.empty, .state { padding: 48px var(--gut); text-align: center; color: var(--ink-2); }
.empty p, .state p { margin: 0 0 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--rule-strong); border-radius: var(--r-btn); background: var(--sheet); color: var(--ink); cursor: pointer; font-size: 14px; margin: 0 4px; }
.btn:hover { border-color: var(--ink-2); }
.skel { height: 14px; border-radius: 4px; background: var(--rule-soft); margin: 18px var(--gut); }
.skel:nth-child(2) { width: 70%; } .skel:nth-child(3) { width: 85%; }

/* ---------- boards ---------- */
.boards { padding: 26px var(--gut) 30px; }
.boards-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.boards-head h2 { font: 600 19px/1.35 var(--font-serif); margin: 0; }
.boards-head p { margin: 0; font-size: 13px; color: var(--ink-2); }
.bgrid { display: grid; grid-template-columns: 128px repeat(3, minmax(0, 1fr)); column-gap: 28px; }
.bgrid .colh { font-size: 12px; color: var(--ink-3); padding: 10px 0 6px; border-bottom: 1px solid var(--rule); }
.bgroup { display: contents; }
.bgroup > * { padding: 12px 0 14px; border-bottom: 1px solid var(--rule-soft); }
.bgroup h3 { margin: 0; font: 600 14px/1.5 var(--font-sans); color: var(--ink); }
.bgroup h3 span { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); }
.blist { list-style: none; margin: 0; }
.blist li { padding: 3px 0; }
.blist .ch { display: none; font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
.blist a { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 1.5; color: var(--ink); text-decoration: none; }
.blist a:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.blist a .ok { width: 13px; height: 13px; margin-top: 4px; flex: none; color: var(--rule-strong); }
.blist a.done { color: var(--ink-3); }
.blist a.done .ok { color: #2F7D55; }
.blist .none { color: var(--ink-3); font-size: 13px; }

.tabbar { display: none; }

@media (prefers-reduced-motion: no-preference) {
  tr.detail td > * { animation: reveal .16s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }
  .chip, .star, .day { transition: background-color .12s, color .12s, border-color .12s; }
}

/* ---------- wide screens: 넓은 모니터에서 열 간격·상세 패널도 넓게 ---------- */
@media (min-width: 1600px) {
  .jobs col.c-due { width: 128px; } .jobs col.c-city { width: 70px; } .jobs col.c-cat { width: 100px; }

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const WD = ["일", "월", "화", "수", "목", "금", "토"];

/* ---------- storage (always guarded) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- state ---------- */
let DATA = { jobs: [], boards: [] };
let TODAY = "";
const st = { city: "", cat: "", org: "", edu: "", q: "", etc: false, pay: false, quick: null, day: null, sortKey: "deadline", sortDir: 1, open: null, view: "jobs" };
let starred = store.get("starred", {});
let boardChecked = store.get("boardChecked", {});
let NEW_SINCE = "";

const localISO = (d = new Date()) => d.toLocaleDateString("sv");
const isoDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function dday(dl) { return isoDate(dl) ? Math.round((toDate(dl) - toDate(TODAY)) / 86400000) : null; }
const keyOf = j => (j.url || "") + "|" + (j.title || "");
const det = j => j.detail || {};

/* ---------- derived fields ---------- */
const EDU_RANK = { "박사": 5, "석사 이상": 4, "학사 이상": 3, "전문학사 이상": 2, "고졸 이상": 1, "무관": 0 };
const eduRank = j => { const e = det(j).education; return e in EDU_RANK ? EDU_RANK[e] : -1; };

function payInfo(j) {
  const d = det(j);
  if (typeof d.salary_monthly === "number" && d.salary_monthly > 0) {
    const sub = d.salary_basis === "연봉" ? "연 " + fmtMan(d.salary_monthly * 12) : (d.salary_basis || "");
    return { monthly: d.salary_monthly, label: "월 " + fmtMan(d.salary_monthly), sub };
  }
  const s = (j.salary || "").trim();
  const m = s.match(/^(월|연)\s*(?:봉)?\s*([\d,.]+)\s*만/);
  if (m) {
    const nums = [...s.matchAll(/([\d,.]+)\s*만/g)].map(x => parseFloat(x[1].replace(/,/g, "")));
    const min = nums[0], max = s.includes("~") ? nums[nums.length - 1] : min;
    if (min > 0 && (!max || max / min <= 2.5)) {
      const monthly = m[1] === "연" ? min / 12 : min;
      if (monthly >= 150 && monthly <= 1000) {
        const range = max && max !== min;
        return { monthly, label: "월 " + fmtMan(monthly) + (range ? "~" : ""), sub: m[1] === "연" ? "연 " + fmtMan(min) + (range ? "~" : "") : (/기본급/.test(s) ? "기본급" : ""), guessed: true };
      }
    }
  }
  return { monthly: null, label: /\d/.test(s) ? "공고 참고" : "비공개", sub: "" };
}
function fmtMan(n) { const r = Math.round(n); return r.toLocaleString("ko-KR") + "만"; }
const hasPay = j => payInfo(j).monthly != null || /\d/.test(j.salary || "");

function contractShort(j) {
  const c = det(j).contract;
  if (c) {
    const r = String(c).match(/(\d{4})[-.]\s*(\d{1,2})[-.]\s*(\d{1,2})\.?\s*~\s*(\d{4})[-.]\s*(\d{1,2})[-.]\s*(\d{1,2})/);
    if (r) {
      const days = (new Date(r[4], r[5] - 1, r[6]) - new Date(r[1], r[2] - 1, r[3])) / 86400000 + 1;
      const mo = Math.round(days / 30.44);
      if (mo > 0) return mo % 12 === 0 ? mo / 12 + "년" : mo + "개월";
    }
    const m = String(c).match(/(\d+(?:\.\d+)?\s*(?:년|개월))/);
    if (m) return m[1].replace(/\s+/g, "");
    if (String(c).length <= 6) return String(c);
  }
  return (j.employment_type || "").replace("시간강사", "강사") || "—";
}
// 근무 시작일: 형식이 제각각이라("2026-12-01(협의 가능)", "2026년 11월 중", "최종합격 후 즉시") 짧은 표기 + 정렬용 날짜로 정리
function startInfo(j) {
  const s = String(det(j).start_date || "").trim();
  if (!s) return { label: "", full: "", t: null };
  const flex = /협의|예정|중/.test(s) ? "~" : "";  // 확정 날짜가 아니면 물결로 표시
  let m = s.match(/(\d{4})[-.년]\s*(\d{1,2})[-.월]\s*(\d{1,2})/);
  if (m) return { label: `${+m[2]}.${String(+m[3]).padStart(2, "0")}${flex}`, full: s, t: new Date(m[1], m[2] - 1, m[3]).getTime() };
  m = s.match(/(\d{4})\s*[-.년]\s*(\d{1,2})\s*월?/);
  if (m) return { label: `${+m[2]}월${/중/.test(s) ? " 중" : ""}`, full: s, t: new Date(m[1], m[2] - 1, 15).getTime() };
  if (/즉시/.test(s)) return { label: "합격 후 즉시", full: s, t: null };
  if (/협의/.test(s)) return { label: "협의", full: s, t: null };
  if (/채용\s*시/.test(s)) return { label: "채용 시", full: s, t: null };
  return { label: s.length > 8 ? s.slice(0, 8) + "…" : s, full: s, t: null };
}
const isNew = j => NEW_SINCE && isoDate(j.posted_date) && j.posted_date > NEW_SINCE;
const isOpen = j => { const d = dday(j.deadline); return d === null || d >= 0; };
const catOf = j => j.category || "기타";

/* ---------- pools & filtering ---------- */
function basePool() { return DATA.jobs.filter(j => isOpen(j) && (st.etc || catOf(j) !== "기타" || st.cat === "기타")); }
const QUICK = {
  today: j => dday(j.deadline) === 0,
  soon: j => { const d = dday(j.deadline); return d !== null && d >= 0 && d <= 3; },
  master: j => eduRank(j) >= 4,
  star: j => !!starred[keyOf(j)],
};
function matches(j, skipDay) {
  if (st.city && j.city !== st.city) return false;
  if (st.cat && catOf(j) !== st.cat) return false;
  if (st.org && j.org_type !== st.org) return false;
  if (st.edu) {
    const r = eduRank(j);
    if (st.edu === "phd" && r !== 5) return false;
    if (st.edu === "master" && r < 4) return false;
    if (st.edu === "low" && !(r >= 0 && r <= 3)) return false;
    if (st.edu === "unknown" && r !== -1) return false;
  }
  if (st.pay && !hasPay(j)) return false;
  if (st.quick && !QUICK[st.quick](j)) return false;
  if (!skipDay && st.day && j.deadline !== st.day) return false;
  if (st.q) {
    const d = det(j);
    const hay = [j.title, j.org, j.requirements, j.notes, j.salary, d.summary, d.major, d.preferred, d.education].join(" ").toLowerCase();
    if (!st.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
function sorted(list) {
  const k = st.sortKey, dir = st.sortDir;
  const val = j => k === "deadline" ? dday(j.deadline) : k === "pay" ? payInfo(j).monthly : k === "start" ? startInfo(j).t : (eduRank(j) < 0 ? null : eduRank(j));
  return list.slice().sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null && vb == null) return tiebreak(a, b);
    if (va == null) return 1; if (vb == null) return -1;
    return (va - vb) * dir || tiebreak(a, b);
  });
}
function tiebreak(a, b) {
  const da = dday(a.deadline), db = dday(b.deadline);
  return (da ?? 9999) - (db ?? 9999) || String(a.org).localeCompare(String(b.org), "ko");
}

/* ---------- rendering: lead ---------- */
function renderLead() {
  const pool = basePool();
  const week = pool.filter(j => { const d = dday(j.deadline); return d !== null && d <= 7; }).length;
  const today = pool.filter(QUICK.today).length;
  const fresh = pool.filter(isNew).length;
  let s = `열린 공고 ${pool.length}건 가운데 이번 주에 ${week}건이 마감되고, `;

/* ---------- rendering: ridge ---------- */
const RIDGE_DAYS = 21;
function renderRidge(list) {
  const el = $("#ridge");
  const days = [];
  for (let i = 0; i < RIDGE_DAYS; i++) { const d = toDate(TODAY); d.setDate(d.getDate() + i); days.push(localISO(d)); }
  const cnt = {}; let later = 0, undated = 0;
  list.forEach(j => {
    const d = dday(j.deadline);
    if (d === null) { undated++; return; }
    if (d >= RIDGE_DAYS) { later++; return; }
    const c = cnt[j.deadline] ||= { cc: 0, wj: 0 };
    j.city === "원주" ? c.wj++ : c.cc++;
  });
  const max = Math.max(3, ...Object.values(cnt).flatMap(c => [c.cc, c.wj]));
  const h = n => n ? Math.max(3, Math.round(n / max * 32)) : 0;
  el.hidden = false;
  el.innerHTML = `<div class="legend" aria-hidden="true"><span><i style="background:var(--city-cc)"></i>춘천</span><span><i style="background:var(--city-wj)"></i>원주</span></div>
    <div class="days" style="--n:${RIDGE_DAYS}" role="group" aria-label="마감일별 공고 수, 날짜를 누르면 그날 마감 공고만 보여요">
    ${days.map((iso, i) => {
      const c = cnt[iso] || { cc: 0, wj: 0 }, dt = toDate(iso), tot = c.cc + c.wj;
      // 라벨은 오늘과 7일 간격만 (월초 라벨을 따로 넣으면 이웃 라벨과 겹친다)
      const lab = i === 0 ? "오늘" : i % 7 === 0 ? `${dt.getMonth() + 1}.${dt.getDate()}` : "";
      const wk = i <= 7 ? ` wk${i === 0 ? " first" : ""}${i === 7 ? " last" : ""}` : "";
      const name = `${dt.getMonth() + 1}월 ${dt.getDate()}일(${WD[dt.getDay()]}) 마감 ${tot}건` + (tot ? `, 춘천 ${c.cc} 원주 ${c.wj}` : "");
      return `<button type="button" class="day${wk}" data-day="${iso}" aria-pressed="${st.day === iso}" aria-label="${name}" data-tip="${name}" ${tot ? "" : "disabled"}>
        <span class="up">${c.cc ? `<span class="bar" style="height:${h(c.cc)}px"></span>` : ""}</span><span class="axis"></span>
        <span class="dn">${c.wj ? `<span class="bar" style="height:${h(c.wj)}px"></span>` : ""}</span><span class="lab">${lab}</span></button>`;
    }).join("")}
    <span aria-hidden="true"></span>
    <div class="bucket" title="${RIDGE_DAYS}일 뒤 마감"><b>${later}</b><span class="axis"></span><span></span><span class="lab">이후</span></div>
    <div class="bucket" title="상시 모집 또는 채용 시 마감"><b>${undated}</b><span class="axis"></span><span></span><span class="lab">상시</span></div>
    </div>`;
}

      const n = B_CITIES.reduce((s, c) => s + (g[k][c] || []).length, 0);
      const done = B_CITIES.reduce((s, c) => s + (g[k][c] || []).filter(b => boardChecked[b.url] === TODAY).length, 0);
      return `<div class="bgroup"><h3>${k}<span>${n}곳${done ? `, ${done}곳 확인` : ""}</span></h3>
        ${B_CITIES.map(c => {
          const items = g[k][c] || [];
          if (!items.length) return `<ul class="blist emp"><li class="none" aria-hidden="true">—</li></ul>`;
          return `<ul class="blist" aria-label="${k} ${c}"><li class="ch">${c}</li>${items.map(b => {
            const ok = boardChecked[b.url] === TODAY;
            return `<li><a class="${ok ? "done" : ""}" href="${esc(b.url)}" target="_blank" rel="noopener" title="${esc(b.desc || b.name)}" data-board="${esc(b.url)}">${icon("i-check", "ok")}<span>${esc(short(b.name))}${ok ? `<span class="vh">, 오늘 확인함</span>` : ""}</span></a></li>`;
          }).join("")}</ul>`;
        }).join("")}</div>`;
    }).join("")}</div>`;
}

/* ---------- main render ---------- */
let annT, WIDE = true, NCOL = 9;
function render() {
  WIDE = innerWidth > 1180 || innerWidth <= 900; NCOL = WIDE ? 10 : 7;
  renderLead();
  const pool = basePool().filter(j => matches(j, true));
  if (matchMedia("(min-width: 901px)").matches) renderRidge(pool); else $("#ridge").hidden = true;
  const list = sorted(pool.filter(j => !st.day || j.deadline === st.day));
  renderTable(list);
  // filter UI sync
  ["cat", "org", "edu"].forEach(k => $("#f-" + k).classList.toggle("set", !!st[k]));
  const active = [st.city, st.cat, st.org, st.edu, st.q, st.pay, st.quick, st.day].filter(Boolean).length;
  $("#reset").hidden = !active;
  const moreN = [st.cat, st.org, st.edu, st.pay, st.etc].filter(Boolean).length;
  $("#more-n").textContent = moreN ? ` ${moreN}` : "";
  clearTimeout(annT); annT = setTimeout(() => { $("#announce").textContent = `공고 ${list.length}건 표시`; }, 500);
  syncTabs();
}
function fillSelects() {
  const pool = DATA.jobs.filter(isOpen);
  const count = k => pool.reduce((m, j) => (m[k(j)] = (m[k(j)] || 0) + 1, m), {});
  const cats = count(catOf), orgs = count(j => j.org_type || "기타");
  const catOrder = ["연구직", "데이터분석", "강사/교원", "기타"];
  $("#f-cat").innerHTML = `<option value="">직종 전체</option>` + Object.keys(cats).sort((a, b) => ((catOrder.indexOf(a) + 1) || 99) - ((catOrder.indexOf(b) + 1) || 99))
    .map(c => `<option value="${esc(c)}">${esc(c === "기타" ? "행정·기타" : c)} ${cats[c]}</option>`).join("");
  $("#f-org").innerHTML = `<option value="">기관 전체</option>` + Object.entries(orgs).sort((a, b) => b[1] - a[1])
    .map(([o, n]) => `<option value="${esc(o)}">${esc(o)} ${n}</option>`).join("");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const chip = t.closest(".chip");
  if (chip) { st.quick = st.quick === chip.dataset.q ? null : chip.dataset.q; st.day = null; render(); return; }
  const day = t.closest(".day");
  if (day) { st.day = st.day === day.dataset.day ? null : day.dataset.day; render(); return; }
  const sb = t.closest("th button[data-sort]");
  if (sb) {
    const k = sb.dataset.sort;
    if (st.sortKey === k) st.sortDir = -st.sortDir; else { st.sortKey = k; st.sortDir = k === "deadline" || k === "start" ? 1 : -1; }
    render(); const nb = $(`th button[data-sort="${k}"]`); if (nb) nb.focus(); return;
  }
  const star = t.closest("button[data-star]");
  if (star) {
    const j = DATA.jobs.find(x => x.id === star.dataset.star); if (!j) return;
    const k = keyOf(j);
    if (starred[k]) delete starred[k]; else starred[k] = { at: TODAY, status: "관심" };
    store.set("starred", starred);
    const on = !!starred[k];
    star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "관심 공고에서 빼기" : "관심 공고에 추가");
    star.innerHTML = icon(on ? "i-star-f" : "i-star", "");
    renderLead(); if (st.quick === "star") render();
    return;
  }
  const act = t.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "clear") clearFilters();
    if (a === "clearq") { st.q = ""; $("#f-q").value = ""; }
    if (a === "etc") { st.etc = true; $("#f-etc").checked = true; }
    render(); return;
  }
  const bl = t.closest("a[data-board]");
  if (bl) { boardChecked[bl.dataset.board] = TODAY; store.set("boardChecked", boardChecked); setTimeout(renderBoards, 0); return; }
  const row = t.closest("tr.job");
  if (row && !t.closest("a, .star")) {
    const id = row.dataset.id;
    st.open = st.open === id ? null : id;
    render();
    const btn = $(`tr.job[data-id="${CSS.escape(id)}"] .ttl`);
    if (btn && t.closest(".ttl")) btn.focus();
    if (st.open) { const r = $(`tr.job[data-id="${CSS.escape(id)}"]`); const top = r.getBoundingClientRect().top; if (top < 40 || top > innerHeight - 120) r.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  }
});
function clearFilters() {
  Object.assign(st, { city: "", cat: "", org: "", edu: "", q: "", pay: false, quick: null, day: null });
  $("#c-all").checked = true; ["cat", "org", "edu"].forEach(k => $("#f-" + k).value = ""); $("#f-q").value = ""; $("#f-pay").checked = false;
}
$("#f-city").addEventListener("change", e => { st.city = e.target.value; render(); });
["cat", "org", "edu"].forEach(k => $("#f-" + k).addEventListener("change", e => { st[k] = e.target.value; render(); }));
$("#f-etc").addEventListener("change", e => { st.etc = e.target.checked; store.set("showEtc", st.etc); render(); });
$("#f-pay").addEventListener("change", e => { st.pay = e.target.checked; render(); });
let qT; $("#f-q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 150); });
$("#reset").addEventListener("click", () => { clearFilters(); render(); });
$("#more-btn").addEventListener("click", e => { const on = $("#more").classList.toggle("show"); e.currentTarget.setAttribute("aria-expanded", on); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#f-q").focus(); }
  if (e.key === "Escape" && st.open) { const id = st.open; st.open = null; render(); const b = $(`tr.job[data-id="${CSS.escape(id)}"] .ttl`); if (b) b.focus(); }
});

/* ridge tooltip */
const tip = $("#tip");
function showTip(el) { if (!el || !el.dataset.tip) return; tip.textContent = el.dataset.tip; tip.hidden = false; const r = el.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)) + "px"; tip.style.top = (r.top - tip.offsetHeight - 6) + "px"; }
document.addEventListener("pointerover", e => { const d = e.target.closest(".day"); d ? showTip(d) : (tip.hidden = true); });
document.addEventListener("focusin", e => { const d = e.target.closest(".day"); d ? showTip(d) : (tip.hidden = true); });
addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

/* tabs (mobile) */
function setView(v) {
  if (v === "star") { st.quick = "star"; st.view = "jobs"; }
  else { if (v === "jobs" && st.quick === "star") st.quick = null; st.view = v; }
  document.body.dataset.view = st.view;
  render(); scrollTo({ top: 0 });
}
function syncTabs() {
  const cur = st.view === "boards" ? "boards" : st.quick === "star" ? "star" : "jobs";
  $$(".tabbar button").forEach(b => b.dataset.tab === cur ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}
$$(".tabbar button").forEach(b => b.addEventListener("click", () => setView(b.dataset.tab)));
$("#to-boards").addEventListener("click", e => { e.preventDefault(); $("#boards-sheet").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); });

/* theme: light by default; dark only when chosen */
function syncTheme() {
  const dark = document.documentElement.dataset.theme === "dark";
  const b = $("#theme");
  b.setAttribute("aria-pressed", dark);
  b.innerHTML = dark ? `${icon("i-sun")}<span>밝게</span>` : `${icon("i-moon")}<span>어둡게</span>`;
  b.setAttribute("aria-label", dark ? "밝은 화면으로 바꾸기" : "어두운 화면으로 바꾸기");
}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { dark ? localStorage.setItem("theme", "dark") : localStorage.removeItem("theme"); } catch (e) {}
  syncTheme();
});
syncTheme();

/* resize: ridge only on wide screens */
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 150); });

/* ---------- load ---------- */
function setStamp() {
  const d = toDate(TODAY);
  $("#stamp").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]}) 기준`;
}
function markVisit() { store.set("visit", { date: TODAY, since: NEW_SINCE }); }
async function load() {
  try {
    // 상대 경로: 집 서버(server.py)와 GitHub Pages(정적 data.json) 양쪽에서 그대로 동작
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch (err) {
    $("#lead-h").textContent = "공고를 불러오지 못했어요.";
    $("#table-wrap").innerHTML = `<div class="state"><p>서버(run_dashboard.bat)가 켜져 있는지 확인한 뒤 다시 시도해 주세요.</p><button type="button" class="btn" id="retry">다시 시도</button></div>`;
    $("#retry").onclick = load;
    return;
  }
  TODAY = localISO();
  // "새" = posted after the previous visit day; same-day revisits keep the same baseline
  const v = store.get("visit", null);
  if (v && v.date === TODAY && v.since) NEW_SINCE = v.since;
  else if (v && v.date && v.date < TODAY) NEW_SINCE = v.date;
  else { const d = toDate(TODAY); d.setDate(d.getDate() - 3); NEW_SINCE = localISO(d); }
  st.etc = !!store.get("showEtc", false); $("#f-etc").checked = st.etc;
  setStamp(); fillSelects(); render(); renderBoards();
  setTimeout(markVisit, 10000);
}
addEventListener("pagehide", () => { if (TODAY) markVisit(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && TODAY && localISO() !== TODAY) { TODAY = localISO(); setStamp(); render(); renderBoards(); }
});
load();
</script>
</body>
</html>
